<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — RH Gestão</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon"><i class="ti ti-building-community"></i></div>
    <div>
      <p class="auth-logo-title">RH Gestão</p>
      <p class="auth-logo-sub">Redefinição de senha</p>
    </div>
  </div>

  <div class="auth-reset-badge"><i class="ti ti-lock-check"></i> Link de redefinição válido</div>

  <h2 class="auth-title">Criar nova senha</h2>

  <div id="err" class="auth-alert" style="display:none;"></div>
  <div id="ok"  class="auth-alert auth-alert-ok" style="display:none;"></div>

  <div class="field-group" style="margin-bottom:12px;">
    <label class="field-label">Nova senha</label>
    <div class="input-icon-wrap">
      <input id="nova" type="password" class="input" placeholder="mínimo 6 caracteres"/>
      <button type="button" class="input-toggle-pass" onclick="togglePass('nova',this)" tabindex="-1"><i class="ti ti-eye"></i></button>
    </div>
  </div>

  <div class="field-group" style="margin-bottom:24px;">
    <label class="field-label">Confirmar nova senha</label>
    <input id="nova2" type="password" class="input" placeholder="repita a senha"/>
  </div>

  <button class="btn btn-primary btn-auth" id="btn" onclick="redefinir()">
    <span id="btn-txt">Salvar nova senha</span>
    <div class="btn-spinner" id="spinner" style="display:none;"></div>
  </button>
</div>

<script>
function togglePass(id,btn){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.querySelector('i').className=i.type==='password'?'ti ti-eye':'ti ti-eye-off';}

async function redefinir(){
  const nova=document.getElementById('nova').value;
  const nova2=document.getElementById('nova2').value;
  const err=document.getElementById('err'), ok=document.getElementById('ok');
  err.style.display='none'; ok.style.display='none';
  if(!nova||nova.length<6){err.textContent='Senha deve ter pelo menos 6 caracteres.';err.style.display='block';return;}
  if(nova!==nova2){err.textContent='Senhas não coincidem.';err.style.display='block';return;}
  document.getElementById('btn').disabled=true;
  document.getElementById('spinner').style.display='inline-block';
  document.getElementById('btn-txt').textContent='Salvando...';
  try{
    await Auth.redefinirSenha(nova);
    ok.textContent='Senha alterada com sucesso!';ok.style.display='block';
    setTimeout(()=>location.href='login.html',2000);
  }catch(e){
    err.textContent=e.message;err.style.display='block';
    document.getElementById('btn').disabled=false;
    document.getElementById('spinner').style.display='none';
    document.getElementById('btn-txt').textContent='Salvar nova senha';
  }
}
</script>
</body>
</html>
