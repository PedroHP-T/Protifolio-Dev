<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RH Gestão</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon"><i class="ti ti-building-community"></i></div>
    <div>
      <p class="auth-logo-title">RH Gestão</p>
      <p class="auth-logo-sub">Sistema de Recursos Humanos</p>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="tab-login">
    <h2 class="auth-title">Entrar na sua conta</h2>

    <div id="login-erro" class="auth-alert" style="display:none;"></div>

    <div class="field-group" style="margin-bottom:14px;">
      <label class="field-label">E-mail</label>
      <div class="input-icon-wrap">
        <i class="ti ti-mail input-icon"></i>
        <input id="login-email" type="email" class="input input-icon-pad" placeholder="seu@email.com" autocomplete="email"/>
      </div>
    </div>

    <div class="field-group" style="margin-bottom:6px;">
      <label class="field-label">Senha</label>
      <div class="input-icon-wrap">
        <i class="ti ti-lock input-icon"></i>
        <input id="login-senha" type="password" class="input input-icon-pad" placeholder="••••••••" autocomplete="current-password"/>
        <button type="button" class="input-toggle-pass" onclick="togglePass('login-senha',this)" tabindex="-1"><i class="ti ti-eye"></i></button>
      </div>
    </div>

    <div style="text-align:right;margin-bottom:20px;">
      <a href="#" onclick="mostrarTab('recuperar')" class="auth-link">Esqueci a senha</a>
    </div>

    <button class="btn btn-primary btn-auth" id="btn-login" onclick="fazerLogin()">
      <span id="btn-login-txt">Entrar</span>
      <div class="btn-spinner" id="spinner-login" style="display:none;"></div>
    </button>

    <p style="text-align:center;font-size:13px;color:var(--color-text-muted);margin-top:20px;">
      Primeira vez?
      <a href="#" onclick="mostrarTab('cadastro')" class="auth-link">Criar conta</a>
    </p>
  </div>

  <!-- CADASTRO -->
  <div id="tab-cadastro" style="display:none;">
    <h2 class="auth-title">Criar conta</h2>
    <div id="cadastro-erro" class="auth-alert" style="display:none;"></div>
    <div id="cadastro-ok"   class="auth-alert auth-alert-ok" style="display:none;"></div>

    <div class="field-group" style="margin-bottom:12px;">
      <label class="field-label">Nome completo</label>
      <input id="cad-nome" type="text" class="input" placeholder="Seu nome"/>
    </div>
    <div class="field-group" style="margin-bottom:12px;">
      <label class="field-label">E-mail</label>
      <input id="cad-email" type="email" class="input" placeholder="seu@email.com"/>
    </div>
    <div class="field-group" style="margin-bottom:12px;">
      <label class="field-label">Senha</label>
      <div class="input-icon-wrap">
        <input id="cad-senha" type="password" class="input" placeholder="mínimo 6 caracteres"/>
        <button type="button" class="input-toggle-pass" onclick="togglePass('cad-senha',this)" tabindex="-1"><i class="ti ti-eye"></i></button>
      </div>
      <div id="senha-forca" style="height:4px;border-radius:2px;margin-top:6px;background:var(--gray-200);overflow:hidden;">
        <div id="senha-forca-barra" style="height:100%;width:0;transition:width .3s,background .3s;border-radius:2px;"></div>
      </div>
    </div>
    <div class="field-group" style="margin-bottom:20px;">
      <label class="field-label">Confirmar senha</label>
      <input id="cad-senha2" type="password" class="input" placeholder="repita a senha"/>
    </div>

    <button class="btn btn-primary btn-auth" id="btn-cad" onclick="fazerCadastro()">
      <span id="btn-cad-txt">Criar conta</span>
      <div class="btn-spinner" id="spinner-cad" style="display:none;"></div>
    </button>

    <p style="text-align:center;font-size:13px;color:var(--color-text-muted);margin-top:16px;">
      Já tem conta? <a href="#" onclick="mostrarTab('login')" class="auth-link">Entrar</a>
    </p>
  </div>

  <!-- RECUPERAR SENHA -->
  <div id="tab-recuperar" style="display:none;">
    <h2 class="auth-title">Recuperar senha</h2>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:20px;">
      Informe seu e-mail e enviaremos um link para redefinir a senha.
    </p>
    <div id="rec-erro" class="auth-alert" style="display:none;"></div>
    <div id="rec-ok"   class="auth-alert auth-alert-ok" style="display:none;"></div>

    <div class="field-group" style="margin-bottom:20px;">
      <label class="field-label">E-mail</label>
      <div class="input-icon-wrap">
        <i class="ti ti-mail input-icon"></i>
        <input id="rec-email" type="email" class="input input-icon-pad" placeholder="seu@email.com"/>
      </div>
    </div>

    <button class="btn btn-primary btn-auth" id="btn-rec" onclick="fazerRecuperacao()">
      <span id="btn-rec-txt">Enviar link</span>
      <div class="btn-spinner" id="spinner-rec" style="display:none;"></div>
    </button>

    <p style="text-align:center;font-size:13px;color:var(--color-text-muted);margin-top:16px;">
      <a href="#" onclick="mostrarTab('login')" class="auth-link">← Voltar ao login</a>
    </p>
  </div>
</div>

<script>
// Verifica se já está logado
(async()=>{
  const p = await Auth.init();
  if(p) location.href='../index.html';
})();

function mostrarTab(tab){
  ['login','cadastro','recuperar'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
}

function togglePass(id, btn){
  const inp=document.getElementById(id);
  inp.type=inp.type==='password'?'text':'password';
  btn.querySelector('i').className=inp.type==='password'?'ti ti-eye':'ti ti-eye-off';
}

// Força da senha
document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('cad-senha');
  if(!inp)return;
  inp.addEventListener('input',()=>{
    const v=inp.value, barra=document.getElementById('senha-forca-barra');
    let score=0;
    if(v.length>=6)score++;if(v.length>=10)score++;
    if(/[A-Z]/.test(v))score++;if(/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;
    const w=[0,20,40,60,80,100][score];
    const c=['transparent','#DC2626','#F59E0B','#F59E0B','#16A34A','#15803D'][score];
    barra.style.width=w+'%'; barra.style.background=c;
  });
});

function setLoading(btnId, spinnerId, txtId, loading, txt){
  document.getElementById(btnId).disabled=loading;
  document.getElementById(spinnerId).style.display=loading?'inline-block':'none';
  document.getElementById(txtId).textContent=loading?'Aguarde...':txt;
}

function showErr(id, msg){ const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; el.className='auth-alert'; }
function showOk(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; el.className='auth-alert auth-alert-ok'; }
function hideAlert(id)   { document.getElementById(id).style.display='none'; }

async function fazerLogin(){
  const email=document.getElementById('login-email').value.trim();
  const senha=document.getElementById('login-senha').value;
  hideAlert('login-erro');
  if(!email||!senha){showErr('login-erro','Preencha e-mail e senha.');return;}
  setLoading('btn-login','spinner-login','btn-login-txt',true,'Entrar');
  try{
    await Auth.login(email,senha);
    location.href='../index.html';
  }catch(e){
    showErr('login-erro', e.message==='Invalid login credentials'?'E-mail ou senha incorretos.':e.message);
    setLoading('btn-login','spinner-login','btn-login-txt',false,'Entrar');
  }
}

async function fazerCadastro(){
  const nome=document.getElementById('cad-nome').value.trim();
  const email=document.getElementById('cad-email').value.trim();
  const senha=document.getElementById('cad-senha').value;
  const senha2=document.getElementById('cad-senha2').value;
  hideAlert('cadastro-erro'); hideAlert('cadastro-ok');
  if(!nome||!email||!senha){showErr('cadastro-erro','Preencha todos os campos.');return;}
  if(senha.length<6){showErr('cadastro-erro','Senha deve ter pelo menos 6 caracteres.');return;}
  if(senha!==senha2){showErr('cadastro-erro','Senhas não coincidem.');return;}
  setLoading('btn-cad','spinner-cad','btn-cad-txt',true,'Criar conta');
  try{
    await Auth.cadastrar(email,senha,nome);
    showOk('cadastro-ok','Conta criada! Verifique seu e-mail para confirmar.');
    setLoading('btn-cad','spinner-cad','btn-cad-txt',false,'Criar conta');
  }catch(e){
    showErr('cadastro-erro',e.message);
    setLoading('btn-cad','spinner-cad','btn-cad-txt',false,'Criar conta');
  }
}

async function fazerRecuperacao(){
  const email=document.getElementById('rec-email').value.trim();
  hideAlert('rec-erro'); hideAlert('rec-ok');
  if(!email){showErr('rec-erro','Informe o e-mail.');return;}
  setLoading('btn-rec','spinner-rec','btn-rec-txt',true,'Enviar link');
  try{
    await Auth.recuperarSenha(email);
    showOk('rec-ok','Link enviado! Verifique sua caixa de entrada.');
    setLoading('btn-rec','spinner-rec','btn-rec-txt',false,'Enviar link');
  }catch(e){
    showErr('rec-erro',e.message);
    setLoading('btn-rec','spinner-rec','btn-rec-txt',false,'Enviar link');
  }
}

// Permite enviar com Enter
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('tab-login').style.display!=='none')fazerLogin();
  else if(document.getElementById('tab-cadastro').style.display!=='none')fazerCadastro();
  else if(document.getElementById('tab-recuperar').style.display!=='none')fazerRecuperacao();
});
</script>
</body>
</html>
