<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Funcionário — RH Gestão</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/db.js"></script>
</head>
<body class="setup-page">

  <div class="setup-card">

    <div class="setup-header">
      <span class="setup-logo">RH Gestão</span>
      <div class="setup-step"><span class="step-badge">Passo 2 de 2</span></div>
      <h1 class="setup-title">Cadastro de funcionário</h1>
      <p class="setup-subtitle">Adicione o primeiro funcionário. Você poderá cadastrar mais dentro do sistema.</p>
    </div>

    <div class="alert alert-error" id="alerta-erro" style="display:none;"></div>

    <!-- Dados pessoais -->
    <div class="form-section">
      <p class="form-section-title">Dados pessoais</p>
      <div class="form-grid cols-1">
        <div class="form-field">
          <label for="nome">Nome completo <span class="required">*</span></label>
          <input type="text" id="nome" placeholder="Ex: Ana Paula Souza"/>
          <span class="field-error" id="erro-nome">Campo obrigatório</span>
        </div>
      </div>
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14"/>
        </div>
        <div class="form-field">
          <label for="rg">RG</label>
          <input type="text" id="rg" placeholder="00.000.000-0"/>
        </div>
      </div>
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-field">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento"/>
        </div>
        <div class="form-field">
          <label for="sexo">Gênero</label>
          <select id="sexo">
            <option value="">Selecione...</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
            <option value="NB">Não binário</option>
            <option value="NI">Prefiro não informar</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Contato -->
    <div class="form-section">
      <p class="form-section-title">Contato</p>
      <div class="form-grid">
        <div class="form-field">
          <label for="email">E-mail <span class="required">*</span></label>
          <input type="email" id="email" placeholder="funcionario@empresa.com"/>
          <span class="field-error" id="erro-email">Campo obrigatório</span>
        </div>
        <div class="form-field">
          <label for="celular">Celular</label>
          <input type="text" id="celular" placeholder="(11) 90000-0000" maxlength="15"/>
        </div>
      </div>
    </div>

    <!-- Cargo e contrato -->
    <div class="form-section">
      <p class="form-section-title">Cargo e contrato</p>
      <div class="form-grid">
        <div class="form-field">
          <label for="cargo">Cargo <span class="required">*</span></label>
          <input type="text" id="cargo" placeholder="Ex: Analista de RH"/>
          <span class="field-error" id="erro-cargo">Campo obrigatório</span>
        </div>
        <div class="form-field">
          <label for="departamento">Departamento</label>
          <select id="departamento">
            <option value="">Selecione...</option>
            <option value="Recursos Humanos">Recursos Humanos</option>
            <option value="Tecnologia">Tecnologia</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Comercial">Comercial</option>
            <option value="Operações">Operações</option>
            <option value="Marketing">Marketing</option>
            <option value="Jurídico">Jurídico</option>
            <option value="Diretoria">Diretoria</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-field">
          <label for="tipo-contrato">Tipo de contrato</label>
          <select id="tipo-contrato">
            <option value="clt">CLT</option>
            <option value="pj">PJ</option>
            <option value="temporario">Temporário</option>
            <option value="estagio">Estágio</option>
            <option value="autonomo">Autônomo</option>
          </select>
        </div>
        <div class="form-field">
          <label for="admissao">Data de admissão <span class="required">*</span></label>
          <input type="date" id="admissao"/>
          <span class="field-error" id="erro-admissao">Campo obrigatório</span>
        </div>
      </div>
    </div>

    <!-- Pagamento -->
    <div class="form-section">
      <p class="form-section-title">Pagamento</p>
      <div class="form-grid cols-3">
        <div class="form-field">
          <label for="salario">Salário (R$) <span class="required">*</span></label>
          <input type="number" id="salario" placeholder="0,00" min="0" step="0.01"/>
          <span class="field-error" id="erro-salario">Campo obrigatório</span>
        </div>
        <div class="form-field">
          <label for="vale-refeicao">Vale refeição (R$)</label>
          <input type="number" id="vale-refeicao" placeholder="0,00" min="0" step="0.01"/>
        </div>
        <div class="form-field">
          <label for="vale-transporte">Vale transporte (R$)</label>
          <input type="number" id="vale-transporte" placeholder="0,00" min="0" step="0.01"/>
        </div>
      </div>
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-field">
          <label for="banco">Banco</label>
          <select id="banco">
            <option value="">Selecione...</option>
            <option value="001">Banco do Brasil</option>
            <option value="033">Santander</option>
            <option value="104">Caixa Econômica</option>
            <option value="237">Bradesco</option>
            <option value="341">Itaú</option>
            <option value="260">Nubank</option>
            <option value="077">Inter</option>
            <option value="290">PagBank</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="form-field">
          <label for="agencia">Agência</label>
          <input type="text" id="agencia" placeholder="0000" maxlength="10"/>
        </div>
      </div>
      <div class="form-grid" style="margin-top:12px;">
        <div class="form-field">
          <label for="conta">Conta</label>
          <input type="text" id="conta" placeholder="00000-0"/>
        </div>
        <div class="form-field">
          <label for="tipo-conta">Tipo de conta</label>
          <select id="tipo-conta">
            <option value="corrente">Corrente</option>
            <option value="poupanca">Poupança</option>
            <option value="pagamento">Pagamento</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Horários -->
    <div class="form-section">
      <p class="form-section-title">Horários</p>
      <div class="form-grid cols-3">
        <div class="form-field">
          <label for="turno">Turno</label>
          <select id="turno" onchange="atualizarHorarios(this.value)">
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="noite">Noite</option>
            <option value="integral">Integral</option>
            <option value="personalizado">Personalizado</option>
          </select>
        </div>
        <div class="form-field">
          <label for="entrada">Entrada</label>
          <input type="time" id="entrada" value="08:00"/>
        </div>
        <div class="form-field">
          <label for="saida">Saída</label>
          <input type="time" id="saida" value="17:00"/>
        </div>
      </div>
      <div class="form-grid cols-1" style="margin-top:12px;">
        <div class="form-field">
          <label>Dias de folga</label>
          <div class="check-group">
            <label class="check-item"><input type="checkbox" name="folga" value="segunda"/> Segunda</label>
            <label class="check-item"><input type="checkbox" name="folga" value="terca"/> Terça</label>
            <label class="check-item"><input type="checkbox" name="folga" value="quarta"/> Quarta</label>
            <label class="check-item"><input type="checkbox" name="folga" value="quinta"/> Quinta</label>
            <label class="check-item"><input type="checkbox" name="folga" value="sexta"/> Sexta</label>
            <label class="check-item"><input type="checkbox" name="folga" value="sabado"/> Sábado</label>
            <label class="check-item"><input type="checkbox" name="folga" value="domingo"/> Domingo</label>
          </div>
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-secondary" onclick="window.location.href='empresa.html'">
        <i class="ti ti-arrow-left"></i> Voltar
      </button>
      <button class="btn btn-primary" id="btn-salvar" onclick="salvarFuncionario()">
        <span id="btn-txt">Concluir cadastro</span>
        <div id="btn-spinner" style="display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;"></div>
        <i class="ti ti-check" id="btn-icone"></i>
      </button>
    </div>

  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert-error { background:var(--color-danger-bg);color:var(--color-danger);border:1px solid var(--color-danger);padding:10px 14px;border-radius:var(--radius-md);font-size:13px;margin-bottom:16px; }
    .field-error  { font-size:11px;color:var(--color-danger);display:none; }
    .field-error.visible { display:block; }
    input.error, select.error { border-color:var(--color-danger)!important; }
  </style>

  <script>
    // Verifica autenticação e se empresa existe
    (async () => {
      const profile = await Auth.init();
      if (!profile) { location.href = '../auth/login.html'; return; }
      try {
        const emp = await DB.getEmpresa();
        if (!emp) { location.href = 'empresa.html'; return; }
        // Se já tem funcionários e não é admin/rh, vai ao dashboard
        const fs = await DB.getFuncionarios();
        if (fs.length > 0 && !['admin','rh'].includes(profile.role)) {
          location.href = '../index.html';
        }
      } catch(e) { console.error(e); }
    })();

    function atualizarHorarios(turno) {
      const h = {
        manha:        { entrada:'06:00', saida:'14:00' },
        tarde:        { entrada:'14:00', saida:'22:00' },
        noite:        { entrada:'22:00', saida:'06:00' },
        integral:     { entrada:'08:00', saida:'18:00' },
        personalizado:{ entrada:'',      saida:''      },
      };
      if (h[turno]) {
        document.getElementById('entrada').value = h[turno].entrada;
        document.getElementById('saida').value   = h[turno].saida;
      }
    }

    function validar(id, erroId) {
      const v = document.getElementById(id)?.value.trim();
      const er = document.getElementById(erroId);
      const el = document.getElementById(id);
      if (!v) { el?.classList.add('error'); er?.classList.add('visible'); return false; }
      el?.classList.remove('error'); er?.classList.remove('visible'); return true;
    }

    function setLoading(on) {
      document.getElementById('btn-salvar').disabled = on;
      document.getElementById('btn-spinner').style.display = on ? 'inline-block' : 'none';
      document.getElementById('btn-icone').style.display   = on ? 'none' : 'inline-block';
      document.getElementById('btn-txt').textContent = on ? 'Salvando...' : 'Concluir cadastro';
    }

    async function salvarFuncionario() {
      const alerta = document.getElementById('alerta-erro');
      alerta.style.display = 'none';

      const ok = [
        validar('nome',    'erro-nome'),
        validar('email',   'erro-email'),
        validar('cargo',   'erro-cargo'),
        validar('admissao','erro-admissao'),
        validar('salario', 'erro-salario'),
      ];
      if (ok.includes(false)) {
        alerta.textContent = 'Preencha todos os campos obrigatórios.';
        alerta.style.display = 'block';
        return;
      }

      const folgas = Array.from(document.querySelectorAll('[name="folga"]:checked')).map(c => c.value);

      setLoading(true);
      try {
        await DB.saveFuncionario({
          nome:           document.getElementById('nome').value.trim(),
          cpf:            document.getElementById('cpf').value.trim(),
          rg:             document.getElementById('rg').value.trim(),
          nascimento:     document.getElementById('nascimento').value || null,
          sexo:           document.getElementById('sexo').value,
          email:          document.getElementById('email').value.trim(),
          celular:        document.getElementById('celular').value.trim(),
          cargo:          document.getElementById('cargo').value.trim(),
          departamento:   document.getElementById('departamento').value,
          tipo_contrato:  document.getElementById('tipo-contrato').value,
          admissao:       document.getElementById('admissao').value,
          salario:        parseFloat(document.getElementById('salario').value) || 0,
          vale_refeicao:  parseFloat(document.getElementById('vale-refeicao').value) || 0,
          vale_transporte:parseFloat(document.getElementById('vale-transporte').value) || 0,
          banco:          document.getElementById('banco').value,
          agencia:        document.getElementById('agencia').value.trim(),
          conta:          document.getElementById('conta').value.trim(),
          tipo_conta:     document.getElementById('tipo-conta').value,
          turno:          document.getElementById('turno').value,
          entrada:        document.getElementById('entrada').value,
          saida:          document.getElementById('saida').value,
          dias_folga:     folgas,
          status:         'ativo',
        });
        location.href = '../index.html';
      } catch(e) {
        alerta.textContent = 'Erro ao salvar: ' + e.message;
        alerta.style.display = 'block';
        setLoading(false);
      }
    }

    // Máscaras
    document.getElementById('cpf').addEventListener('input', function() {
      let v = this.value.replace(/\D/g,'').slice(0,11);
      v = v.replace(/(\d{3})(\d)/,'$1.$2');
      v = v.replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3');
      v = v.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4');
      this.value = v;
    });
    document.getElementById('celular').addEventListener('input', function() {
      let v = this.value.replace(/\D/g,'').slice(0,11);
      v = v.replace(/^(\d{2})(\d)/,'($1) $2');
      v = v.replace(/(\d{5})(\d)/,'$1-$2');
      this.value = v;
    });
    // Remove erros ao digitar
    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', () => {
        el.classList.remove('error');
        const er = document.getElementById('erro-'+el.id);
        if(er) er.classList.remove('visible');
      });
    });
  </script>
</body>
</html>
